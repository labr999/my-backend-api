<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>象棋棋譜倉庫｜棋手庫</title><style>
body{margin:0;background:#f7f2e8;color:#24180f;font-family:system-ui,"Noto Sans TC",sans-serif}header{background:#7f1717;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10}.back{color:#fff;text-decoration:none;margin-right:14px}main{max-width:1180px;margin:auto;padding:16px}.hero,.bar,.stats,.panel,.card{background:#fff;border:1px solid #e7dac8;border-radius:16px}.hero{padding:18px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:1.35rem}.hero p{margin:0;color:#76675b;font-size:.86rem}.bar{padding:14px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:12px}.field,button{padding:10px 11px;border:1px solid #ddcfbb;border-radius:10px;font:inherit;box-sizing:border-box}button{background:#8b1a1a;color:#fff;cursor:pointer}.stats{display:flex;gap:20px;padding:12px 14px;margin-bottom:12px;font-size:.84rem}.stats b{font-size:1.05rem}.layout{display:grid;grid-template-columns:300px 1fr;gap:12px}.panel{padding:14px;height:max-content}.panel h2{font-size:1rem;margin:0 0 10px}.players{display:grid;gap:7px;max-height:620px;overflow:auto}.p{padding:10px;border:1px solid #eadfce;border-radius:10px;cursor:pointer;background:#fff}.p:hover,.p.active{background:#f4eadc}.p b{display:block}.p span{font-size:.76rem;color:#76675b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}.card{padding:15px}.card h3{margin:0 0 7px;font-size:1rem}.meta{font-size:.8rem;color:#76675b;line-height:1.7}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#f0e7db;margin-right:5px}.moves{margin-top:9px;font-size:.82rem;line-height:1.75;max-height:105px;overflow:auto;background:#faf7f1;padding:8px;border-radius:9px}.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.actions a{display:inline-block;text-decoration:none;padding:8px 10px;border-radius:9px;background:#8b1a1a;color:#fff;font-size:.8rem}.actions a.alt{background:#eee6db;color:#5c4637}.empty{padding:25px;text-align:center}.hint{font-size:.76rem;color:#76675b;margin-top:8px}.profile{display:none;background:#fff;border:1px solid #e7dac8;border-radius:16px;padding:18px;margin-bottom:12px}.profile.show{display:block}.profileTop{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.profileName{font-size:1.45rem;font-weight:800;margin:0 0 5px}.profileTitle{color:#76675b}.profileStats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.pill{background:#f1e5d7;border-radius:999px;padding:6px 10px;font-size:.78rem}.profileActions{display:flex;gap:8px;flex-wrap:wrap}.profileActions a{padding:9px 12px;border-radius:9px;background:#8b1a1a;color:#fff;text-decoration:none;font-size:.8rem}.profileActions a.alt{background:#eee6db;color:#5c4637}.altBtn{background:#eee6db;color:#5c4637}.progressWrap{height:12px;background:#eee6db;border-radius:99px;overflow:hidden;margin-top:12px}.progressBar{height:100%;width:0;background:#8b1a1a;transition:width .25s}.progressText{font-size:.8rem;margin-top:7px;font-weight:700}.playerSearch{width:100%;margin-bottom:9px}.small{font-size:.75rem;color:#76675b}@media(max-width:850px){.layout{grid-template-columns:1fr}.players{max-height:260px}.bar{grid-template-columns:1fr 1fr}.bar .wide{grid-column:1/-1}}
</style></head><body>
<div id="xq-version-badge" style="position:fixed;top:10px;right:10px;z-index:99999;background:#111;color:#fff;padding:6px 10px;border-radius:999px;font:600 12px/1.2 system-ui, sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2)">象棋小棋聖 <span style="opacity:.75">V2.9.6</span> <span id="xq-version-status">●</span></div>
<script>
(async()=>{try{const r=await fetch('/api/health',{cache:'no-store'});const d=await r.json();const el=document.getElementById('xq-version-status');if(el)el.textContent=d.ok?'● V'+d.version:'● OFFLINE';}catch(e){}})();
</script><header><a class="back" href="/">← 象棋開局譜</a><b>📚 棋譜倉庫　👑 棋手庫</b></header><main>
<section class="hero"><h1>象棋名家棋譜與棋手資料庫</h1><p>內建示範名家資料＋公開棋譜索引。可點左側棋手進行專屬同步，也可以搜尋棋手、賽事、開局。</p></section><section class="hero" style="margin-top:12px"><h2 style="margin:0 0 7px;font-size:1.05rem">🌐 東萍公開索引同步中心 V2.9.6</h2><p>點擊左側棋手即刻同步指定棋手棋譜（預設最多 20 頁、100 盤），不做全站同步。測試連線成功後即可同步存入本機，可直接回原棋盤播放。</p><div style="display:grid;grid-template-columns:1fr 150px 110px 110px;gap:8px;margin-top:10px"><input id="dpxqUrl" class="field" value="http://www.dpxq.com/hldcg/search/" placeholder="東萍搜尋網址（http://www.dpxq.com/hldcg/search/）"><input id="syncPlayer" class="field" placeholder="棋手（點左側棋手自動填入）"><input id="maxPages" class="field" type="number" min="1" max="100" value="20" title="最多同步頁數"><button onclick="testDpxq()" class="altBtn">🔍 測試連線</button><button onclick="startSync()">🔄 同步此棋手</button></div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="altBtn" onclick="cancelSync()">停止同步</button></div><div class="progressWrap"><div id="progressBar" class="progressBar"></div></div><div id="progressText" class="progressText">尚未開始同步</div><div id="syncMsg" class="hint"></div></section>
<div class="stats"><span>棋手 <b id="pc">-</b></span><span>棋譜 <b id="gc">-</b></span><span>可播放 <b id="pg">-</b></span><span>來源：東萍公開索引＋詳細頁</span></div>
<section id="profile" class="profile"><div class="profileTop"><div><div id="profileName" class="profileName">👑 王天一</div><div id="profileTitle" class="profileTitle">特級大師</div><div id="profileStats" class="profileStats"></div></div><div class="profileActions"><button id="btnSyncCurrentPlayer" style="padding:9px 12px;border-radius:9px;background:#8b1a1a;color:#fff;border:none;font-size:.8rem;font-weight:700;cursor:pointer">🔄 同步此棋手棋譜</button><a id="profileLink" href="#">查看完整棋手頁</a><a class="alt" href="/repository.html" onclick="clearPlayer(event)">清除選擇</a></div></div></section><div class="layout"><aside class="panel"><h2>👑 棋手庫</h2><input id="pq" class="field playerSearch" placeholder="搜尋棋手，例如 王天一"><div id="players" class="players"></div></aside>
<section><div class="bar"><input id="q" class="field wide" placeholder="搜尋棋手／賽事／開局／關鍵字"><input id="player" class="field" placeholder="棋手"><input id="year" class="field" placeholder="年份"><input id="opening" class="field" placeholder="開局"><select id="result" class="field"><option value="">全部結果</option><option>紅勝</option><option>紅先勝</option><option>黑勝</option><option>和棋</option><option>未知</option></select><button onclick="load()">搜尋</button></div><div id="list" class="grid"></div></section></div></main><script>
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function stats(){const d=await fetch('/api/stats').then(r=>r.json());$('pc').textContent=d.players;$('gc').textContent=d.games;$('pg').textContent=d.playableGames}
async function loadPlayers(q=''){const d=await fetch('/api/players?q='+encodeURIComponent(q)+'&limit=500').then(r=>r.json());$('players').innerHTML=d.items.length?d.items.map(p=>`<div class="p" data-name="${esc(p.name)}" onclick="pickPlayer('${encodeURIComponent(p.name)}')"><b>${esc(p.name)}</b><div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><span>${esc(p.title||'棋手')} · ${p.games||0} 盤</span><button style="padding:2px 8px;font-size:.72rem;background:#8b1a1a;color:#fff;border:none;border-radius:6px;cursor:pointer" onclick="event.stopPropagation();syncPlayerByName('${encodeURIComponent(p.name)}')">🔄 同步</button></div></div>`).join(''):'<div class="empty">目前沒有棋手資料</div>'}
function pickPlayer(n){const name=decodeURIComponent(n);$('player').value=name;$('q').value=name;$('syncPlayer').value=name;document.querySelectorAll('.p').forEach(x=>x.classList.remove('active'));const card=[...document.querySelectorAll('.p')].find(x=>x.dataset.name===name);if(card)card.classList.add('active');showProfile(name);load()}
function syncPlayerByName(n){const name=decodeURIComponent(n);$('syncPlayer').value=name;$('player').value=name;$('q').value=name;showProfile(name);startSync()}
async function showProfile(name){try{const r=await fetch('/api/players/'+encodeURIComponent(name));if(!r.ok)throw 0;const d=await r.json(),p=d.player,s=d.stats||{};$('profile').classList.add('show');$('profileName').textContent='👑 '+p.name;$('profileTitle').textContent=p.title||'棋手';$('profileStats').innerHTML='<span class="pill">📚 '+(s.games||0)+' 盤</span><span class="pill">🟢 勝 '+(s.wins||0)+'</span><span class="pill">🔴 負 '+(s.losses||0)+'</span><span class="pill">🟡 和 '+(s.draws||0)+'</span><span class="pill">📊 勝率 '+(s.winRate||0)+'%</span>';$('profileLink').href='/player.html?name='+encodeURIComponent(name);$('btnSyncCurrentPlayer').onclick=()=>syncPlayerByName(name);}catch(e){}}
function clearPlayer(e){e.preventDefault();history.replaceState({},'', '/repository.html');$('profile').classList.remove('show');$('player').value='';$('q').value='';$('syncPlayer').value='';load()}
async function load(){const p=new URLSearchParams({q:$('q').value,player:$('player').value,year:$('year').value,opening:$('opening').value,result:$('result').value,limit:300});const r=await fetch('/api/games?'+p);const d=await r.json();$('list').innerHTML=d.items.length?d.items.map(g=>{const moves=g.moves||[];return `<article class="card"><h3>${esc(g.red)} <span class="tag">${esc(g.result||'未知')}</span> ${esc(g.black)}</h3><div class="meta">${esc(g.event||'')}　${g.year||''}<br>開局：${esc(g.opening||'未分類')}　來源：${esc(g.source||'')}</div>${moves.length?`<div class="moves">${moves.map((m,i)=>`${i%2===0?`<b>${Math.floor(i/2)+1}.</b>`:''}${esc(m)} `).join('')}</div>`:`<div class="hint">此筆為索引資料，尚未收錄完整著法。</div>`}<div class="actions"><a href="/game.html?id=${g.id}">查看棋譜</a><a href="/?gameId=${g.id}">原棋盤播放</a>${g.detailUrl?`<a class="alt" href="${esc(g.detailUrl)}" target="_blank">公開棋譜頁</a>`:''}${g.sourceUrl?`<a class="alt" href="${esc(g.sourceUrl)}" target="_blank">東萍來源</a>`:''}</div></article>`}).join(''):`<div class="card empty">找不到符合條件的棋譜。請清空搜尋或點左側棋手。</div>`}
let pollTimer=null;
async function testDpxq(){const url=$('dpxqUrl').value.trim();if(!url)return;$('syncMsg').textContent='🔍 測試東萍連線中（最多重試3次、每次10秒）…';try{const r=await fetch('/api/dpxq/test?url='+encodeURIComponent(url),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'連線失敗');$('syncMsg').textContent=`🟢 東萍連線正常　HTTP頁面已取得　${d.ms} ms　索引棋譜 ${d.indexGames}　DhtmlXQ 區塊 ${d.dhtmlxqBlocks}。${d.message}`;}catch(e){$('syncMsg').textContent='🔴 東萍連線失敗：'+e.message}}
async function startSync(){const url=$('dpxqUrl').value.trim()||'http://www.dpxq.com/hldcg/search/',player=$('syncPlayer').value.trim(),maxPages=Number($('maxPages').value||20);const msg=$('syncMsg');if(!player){msg.textContent='💡 請點選左側棋手，或在「棋手」欄位輸入棋手姓名以進行專屬同步。';return;}msg.textContent=`準備同步「${player}」相關棋譜（最多 ${maxPages} 頁／100 盤）…`;try{const r=await fetch('/api/dpxq/sync/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,player,maxPages})});const d=await r.json();if(!r.ok)throw new Error(d.error||'啟動失敗');pollSync();}catch(e){msg.textContent='❌ '+e.message}}
async function pollSync(){clearTimeout(pollTimer);try{const d=await fetch('/api/dpxq/sync/status').then(r=>r.json());const pct=Number(d.progress||0);$('progressBar').style.width=pct+'%';if(d.status==='idle'){$('progressText').textContent='尚未開始同步';return}$('progressText').textContent=`${d.status==='done'?'✔ 完成':d.status==='error'?'❌ 錯誤':d.status==='cancelled'?'⏹ 已停止':'🔄 同步中'}　頁面 ${d.pagesDone||0}/${d.maxPages||0}　索引 ${d.found||0}　詳細頁 ${d.detailDone||0}/${d.detailTotal||0}　新增 ${d.added||0}　更新/去重 ${d.updated||0}　可播放 ${d.playable||0}　錯誤 ${d.errors||0}`;$('syncMsg').textContent=d.error||((d.player?`棋手：${d.player}　`:'')+(d.currentUrl?`目前：${d.currentUrl}`:'')+(d.validationErrors?`　走法驗證警告 ${d.validationErrors}`:''));if(d.status==='done'||d.status==='error'||d.status==='cancelled'){await stats();await loadPlayers();await load();return}pollTimer=setTimeout(pollSync,1000)}catch(e){$('syncMsg').textContent='❌ 無法取得同步進度：'+e.message;pollTimer=setTimeout(pollSync,2000)}}
async function cancelSync(){try{await fetch('/api/dpxq/sync/cancel',{method:'POST'});pollSync()}catch(e){}}
$('pq').addEventListener('input',e=>loadPlayers(e.target.value));['q','player','year','opening'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')load()}));
stats();loadPlayers();load();
</script></body></html>
