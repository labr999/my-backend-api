<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棋手庫 V2.9.2</title><style>body{font-family:system-ui,"Microsoft JhengHei";background:#f5efe4;margin:0;color:#30251c}header{background:#8d1515;color:white;padding:14px 22px}main{max-width:1200px;margin:20px auto;padding:0 16px}.box{background:#fff;border:1px solid #dfd1c0;border-radius:14px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:260px 1fr;gap:15px}.player{padding:10px;border:1px solid #eadfd0;border-radius:9px;margin:5px 0;cursor:pointer}.game{border:1px solid #eadfd0;border-radius:10px;padding:12px;margin:8px 0}button,input{padding:10px;border:1px solid #d4c4b2;border-radius:8px}button{background:#8d1515;color:#fff}</style></head><body><header>象棋小棋聖　｜　棋手庫　｜　<b>V2.9.2</b></header><main><div class="box"><h2 id="title">大師棋手資料庫</h2><p id="meta"></p><div id="syncbox"></div></div><div class="grid"><div class="box"><input id="q" placeholder="搜尋棋手"><button onclick="load()">搜尋</button><p class="muted">預設大師同步：點擊棋手後可只同步該棋手（最多 20 頁／100 盤），不會全面同步。</p><div id="plist"></div></div><div class="box"><h3>棋譜</h3><div id="games"></div></div></div></main><script>const qs=new URLSearchParams(location.search);async function api(u,o){const r=await fetch(u,o);const j=await r.json();if(!r.ok)throw new Error(j.error||'API錯誤');return j}async function load(){const j=await api('/api/players?q='+encodeURIComponent(q.value));plist.innerHTML=j.items.map(p=>`<div class="player" onclick="show('${encodeURIComponent(p.name)}')"><b>${p.name}</b><br><small>${p.title||'棋手'} · ${p.games}盤</small></div>`).join('')}async function show(n){const name=decodeURIComponent(n);const j=await api('/api/players/'+n);title.textContent='👑 '+j.player.name;meta.textContent=`${j.player.title||'棋手'}　共 ${j.games.length} 盤　勝 ${j.stats.wins}　和 ${j.stats.draws}　負 ${j.stats.losses}`;syncbox.innerHTML=`<button onclick="sync('${name.replace(/'/g,"\'")}')">🔄 只同步 ${j.player.name}</button>　<a href="http://www.dpxq.com/hldcg/search/" target="_blank">🌐 東萍搜尋頁</a>`;games.innerHTML=j.games.map(g=>`<div class="game"><b>${g.red}　${g.result}　${g.black}</b><br>${g.year||''} ${g.event||''} ｜ ${g.opening||''}<br><a href="game.html?id=${g.id}">▶ 原棋盤播放</a>　${g.detailUrl?`<a href="${g.detailUrl}" target="_blank">🌐 公開棋譜頁</a>`:''}</div>`).join('')}async function sync(name){syncbox.innerHTML+=' <span>⏳ 同步中…</span>';try{const j=await api('/api/dpxq/sync-player',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:name})});syncbox.innerHTML=`<button onclick="sync('${name.replace(/'/g,"\'")}')">🔄 再同步</button> <span>✅ ${j.stats.message}</span>`;show(encodeURIComponent(name))}catch(e){syncbox.innerHTML+=' <span>❌ '+e.message+'</span>'}}q.value=qs.get('player')||'';load().then(()=>{if(q.value)show(encodeURIComponent(q.value))})</script></body></html>
