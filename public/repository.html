<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東萍公開索引同步中心 V2.8</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f7f5f0;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header-bar {
            background-color: #800000;
            color: #fff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }
        .main-container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 16px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e8e8e8;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #800000;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-subtitle {
            font-size: 12px;
            color: #777;
            margin-bottom: 16px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        input[type="text"], input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        .url-input { flex: 1; min-width: 300px; }
        .btn {
            background-color: #800000;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #a00000; }
        .btn-secondary {
            background-color: #666;
        }
        .btn-secondary:hover { background-color: #555; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .status-box {
            background: #fdf6f6;
            border: 1px solid #f5cece;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 13px;
            margin-top: 10px;
            color: #800000;
        }
        .status-box.success {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }
    </style>
</head>
<body>

<div class="header-bar">
    <div>象棋名家棋譜與棋手資料庫</div>
    <div style="font-size: 12px; opacity: 0.8;">全盤小棋室 V2.8</div>
</div>

<div class="main-container">
    <div class="card">
        <div class="card-title">🌐 東萍公開索引同步中心 V2.8</div>
        <div class="card-subtitle">自動分頁同步、單頁轉接去重，棋手賽事同步與進度保持。同步詳細頁後解析 DhtmlXQ 著法並存入本地棋譜庫。</div>

        <div class="input-row">
            <input type="text" id="target-url" class="url-input" value="http://www.dpxq.com/h5/1.html" placeholder="輸入東萍棋譜或目錄網址">
            <input type="text" id="player-filter" style="width: 120px;" placeholder="棋手 (可空白)">
            <input type="number" id="page-limit" style="width: 70px;" value="20">
            <button class="btn" id="btn-sync" onclick="startSync()">開始自動同步</button>
        </div>

        <div class="input-row">
            <button class="btn btn-secondary" onclick="startSync(true)">只同步這一頁</button>
            <button class="btn btn-secondary" onclick="stopSync()">停止同步</button>
        </div>

        <div id="status-display" class="status-box">尚未開始同步</div>
    </div>
</div>

<script>
let isSyncing = false;

async function startSync(singlePageOnly = false) {
    const urlInput = document.getElementById('target-url').value.trim();
    const statusDisplay = document.getElementById('status-display');
    const syncBtn = document.getElementById('btn-sync');

    if (!urlInput) {
        updateStatus('❌ 請輸入東萍網址', false);
        return;
    }

    isSyncing = true;
    syncBtn.disabled = true;
    updateStatus('⏳ 正在連接後端 API 抓取棋譜...', true);

    try {
        // Safe backend fetch
        const apiUrl = `/api/fetch-dpxq?url=${encodeURIComponent(urlInput)}`;
        const response = await fetch(apiUrl);

        // Defensive Check 1: Check HTTP Status
        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`伺服器錯誤 (HTTP ${response.status})`);
        }

        // Defensive Check 2: Check Content-Type header
        const contentType = response.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
            throw new Error('後端回傳無效格式 (非 JSON)，請確認 API 路由設定');
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || '同步失敗');
        }

        // Display Success Result
        updateStatus(`✅ 同步成功！《${data.title}》 [${data.red} VS ${data.black}]`, true, true);
        console.log('同步到的棋譜數據:', data);

    } catch (err) {
        console.error('Sync Error:', err);
        updateStatus(`❌ 同步中斷：${err.message}`, false);
    } finally {
        isSyncing = false;
        syncBtn.disabled = false;
    }
}

function stopSync() {
    isSyncing = false;
    updateStatus('⏸️ 已停止同步', false);
}

function updateStatus(msg, isInfo = true, isSuccess = false) {
    const el = document.getElementById('status-display');
    el.textContent = msg;
    if (isSuccess) {
        el.className = 'status-box success';
    } else {
        el.className = 'status-box';
    }
}
</script>

</body>
</html>
