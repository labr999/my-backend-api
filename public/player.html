<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棋手名家｜完整資料</title><style>
:root{--red:#8b1a1a;--bg:#f7f2e8;--line:#e7dac8;--muted:#76675b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#24180f;font-family:system-ui,"Noto Sans TC",sans-serif}header{background:var(--red);color:#fff;padding:15px 18px;position:sticky;top:0;z-index:5}.back{color:#fff;text-decoration:none;margin-right:14px}main{max-width:1180px;margin:auto;padding:16px}.hero,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:16px}.hero{padding:20px;margin-bottom:12px}.hero h1{margin:0 0 5px;font-size:1.6rem}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0}.stat{padding:14px;text-align:center}.stat b{display:block;font-size:1.35rem}.stat span{font-size:.76rem;color:var(--muted)}.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.panel{padding:15px}.panel h2{font-size:1rem;margin:0 0 10px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee5da;font-size:.84rem}.row:last-child{border-bottom:0}.tag{background:#f1e5d7;padding:3px 7px;border-radius:999px;font-size:.72rem}.games{display:grid;gap:12px;margin-top:12px}.game{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.game h3{margin:0 0 6px;font-size:1rem}.game a{display:inline-block;margin-top:8px;background:var(--red);color:#fff;text-decoration:none;padding:8px 10px;border-radius:8px;font-size:.8rem}.moves{font-size:.82rem;line-height:1.9;background:#faf7f1;border-radius:10px;padding:10px;margin-top:9px}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:800px){.stats{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr}.hero h1{font-size:1.3rem}}
</style></head><body>
<div id="xq-version-badge" style="position:fixed;top:10px;right:10px;z-index:99999;background:#111;color:#fff;padding:6px 10px;border-radius:999px;font:600 12px/1.2 system-ui, sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2)">象棋小棋聖 <span style="opacity:.75">V2.9.5</span> <span id="xq-version-status">●</span></div>
<script>
(async()=>{try{const r=await fetch('/api/health',{cache:'no-store'});const d=await r.json();const el=document.getElementById('xq-version-status');if(el)el.textContent=d.ok?'● V'+d.version:'● OFFLINE';}catch(e){}})();
</script><header><a class="back" href="/players.html">← 棋手庫</a><b>♟ 棋手完整資料</b></header><main id="app"><div class="hero">載入中…</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=new URLSearchParams(location.search).get('name');
function listRows(items,label){return items?.length?items.slice(0,10).map(x=>`<div class="row"><span>${esc(x.name||x.year||'—')}</span><span><span class="tag">${x.games} 盤</span></span></div>`).join(''):`<div class="empty">目前沒有資料</div>`}
async function load(){try{const r=await fetch('/api/players/'+encodeURIComponent(n));if(!r.ok)throw new Error();const d=await r.json(),p=d.player,s=d.stats||{};document.title=p.name+'｜棋手名家';app.innerHTML=`
<section class="hero"><h1>👑 ${esc(p.name)}</h1><div class="muted">${esc(p.title||'棋手')}　·　目前資料庫收錄 ${s.games||0} 盤</div><button style="margin-top:10px;padding:8px 14px;border:none;border-radius:9px;background:#8b1a1a;color:#fff;font-weight:700;cursor:pointer" onclick="syncThisPlayer('${esc(p.name)}')">🔄 從東萍同步【${esc(p.name)}】最新棋譜</button></section>
<section class="stats"><div class="stat"><b>${s.games||0}</b><span>總對局</span></div><div class="stat"><b>${s.wins||0}</b><span>勝</span></div><div class="stat"><b>${s.losses||0}</b><span>負</span></div><div class="stat"><b>${s.draws||0}</b><span>和</span></div><div class="stat"><b>${s.winRate||0}%</b><span>決定局勝率</span></div><div class="stat"><b>${s.unknown||0}</b><span>結果未知</span></div></section>
<section class="cols"><div class="panel"><h2>⚔️ 主要對手</h2>${listRows(s.opponents)}</div><div class="panel"><h2>♟ 常用開局</h2>${listRows(s.openings)}</div><div class="panel"><h2>🏆 賽事</h2>${listRows(s.events)}</div></section>
<section class="panel" style="margin-top:12px"><h2>📅 年份統計</h2>${listRows(s.years)}</section>
<section><h2 style="font-size:1.05rem;margin:18px 2px 8px">📚 全部收錄對局</h2><div class="games">${d.games.length?d.games.map(g=>`<article class="game"><h3>${esc(g.red)}　<span class="tag">${esc(g.result||'未知')}</span>　${esc(g.black)}</h3><div class="muted">${esc(g.event||'未標註賽事')}　${g.year||'年份未知'}　·　${esc(g.opening||'未分類開局')}</div>${g.moves?.length?`<div class="moves">${g.moves.map((m,i)=>`${i%2===0?`<b>${Math.floor(i/2)+1}.</b>`:''}${esc(m)} `).join('')}</div>`:''}<div style="display:flex;gap:8px;margin-top:8px"><a href="/game.html?id=${g.id}">查看完整棋譜</a><a href="/?gameId=${g.id}" style="background:#5c0f0f">▶ 原棋盤播放</a></div></article>`).join(''):'<div class="hero empty">目前沒有已收錄對局</div>'}</div></section>`}catch(e){app.innerHTML='<div class="hero empty">找不到這位棋手，請返回棋手庫。</div>'}}
async function syncThisPlayer(name){const btn=event.target;btn.disabled=true;btn.textContent='⏳ 正在同步 '+name+'…';try{const r=await fetch('/api/dpxq/sync-player',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:name})});const j=await r.json();if(!r.ok)throw new Error(j.error||'同步失敗');alert('✔ '+name+' 同步完成！新增 '+(j.stats?j.stats.added:0)+' 盤。');location.reload();}catch(e){alert('❌ 同步失敗：'+e.message);btn.disabled=false;btn.textContent='🔄 從東萍同步【'+name+'】最新棋譜';}}
load();
</script></body></html>
