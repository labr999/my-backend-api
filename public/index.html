<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>象棋小棋聖 V2.9</title><style>body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f5efe4;color:#2d241c}header{background:#8d1515;color:#fff;padding:14px 22px;display:flex;justify-content:space-between}main{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #e3d7c7;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0000000a}h1{margin:0 0 5px}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{padding:11px;border-radius:9px;border:1px solid #d6c8b7;font-size:15px}input{flex:1;min-width:260px}button{cursor:pointer;background:#8d1515;color:#fff}.muted{color:#756a60;font-size:13px}.bar{height:12px;background:#eadfd0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#8d1515;width:0}.stats{display:flex;gap:18px;margin:10px 0}.game{border:1px solid #eadfd0;border-radius:12px;padding:12px;margin:9px 0}.game a{color:#8d1515;text-decoration:none;font-weight:700}.tag{display:inline-block;background:#f0e7da;padding:4px 7px;border-radius:7px;margin:3px;font-size:12px}</style></head><body><header><b>象棋小棋聖</b><b>V2.9</b></header><main><div class="card"><h1>東萍大師棋譜匯入</h1><p class="muted">使用 Playwright 開啟東萍公開頁，嘗試執行棋譜導出，再保存 DhtmlXQ/WXF、棋手、開局與可播放座標。</p><div class="row"><input id="url" value="http://www.dpxq.com/hldcg/search/" placeholder="東萍網址（http://）"><button onclick="test()">🔎 測試連線</button><button onclick="imp()">📥 單盤匯入</button></div><p id="msg" class="muted"></p><div class="bar"><i id="progress"></i></div><p id="stat" class="muted"></p></div><div class="card"><h2>👑 預設大師／搜尋棋手同步</h2><p class="muted">只同步指定棋手，不做全站同步。預設最多 5 頁、100 盤；可再輸入其他棋手搜尋。</p><div id="masters" class="row"></div><div class="row"><input id="sp" placeholder="輸入棋手，例如 王天一、許銀川"><button onclick="syncSearchPlayer()">🔄 同步此棋手</button></div><p id="syncmsg" class="muted"></p></div><div class="card"><h2>棋手庫</h2><div class="row"><input id="pq" placeholder="搜尋棋手，例如 王天一"><button onclick="loadPlayers()">搜尋</button></div><div id="players"></div></div><div class="card"><h2>大師棋譜</h2><div class="row"><input id="gq" placeholder="搜尋棋手／賽事／開局"><button onclick="loadGames()">搜尋</button></div><div id="games"></div></div></main><script>
async function api(u,o){const r=await fetch(u,o);const j=await r.json();if(!r.ok)throw new Error(j.error||'API錯誤');return j}
async function test(){msg('測試 Playwright…');try{const j=await api('/api/dpxq/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.value})});msg('✅ '+j.title+' ｜ '+j.url)}catch(e){msg('❌ '+e.message)}}
async function imp(){msg('啟動 V2.9 Playwright 匯入…');try{const j=await api('/api/dpxq/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.value})});msg('✅ 完成：新增 '+j.stats.added+'、重複 '+j.stats.duplicates+'、錯誤 '+j.stats.errors);loadPlayers();loadGames()}catch(e){msg('❌ '+e.message)}}
function msg(t){document.getElementById('msg').textContent=t}
async function poll(){try{const j=await api('/api/dpxq/progress');const n=Math.min(100,(j.processed||0)*20);progress.style.width=n+'%';stat.textContent=j.message||''}catch{}}setInterval(poll,700)
async function loadMasters(){try{const j=await api('/api/dpxq/masters');masters.innerHTML=j.items.map(p=>`<button onclick="syncPlayer('${p.name}')">👑 ${p.name} · 同步</button>`).join('')}catch(e){masters.textContent=e.message}}
async function syncPlayer(name){sp.value=name;syncmsg.textContent='⏳ 正在同步 '+name+'（只抓此棋手）…';try{const j=await api('/api/dpxq/sync-player',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:name})});syncmsg.textContent='✅ '+j.stats.message;loadPlayers();loadGames()}catch(e){syncmsg.textContent='❌ '+e.message}}
async function syncSearchPlayer(){const name=sp.value.trim();if(!name)return syncmsg.textContent='請輸入棋手姓名';syncPlayer(name)}
async function loadPlayers(){const j=await api('/api/players?q='+encodeURIComponent(pq.value));players.innerHTML=j.items.map(p=>`<span class="tag"><a href="repository.html?player=${encodeURIComponent(p.name)}">${p.name}</a> ${p.games}盤</span>`).join('')||'沒有資料'}
async function loadGames(){const j=await api('/api/games?q='+encodeURIComponent(gq.value));games.innerHTML=j.items.map(g=>`<div class="game"><b>${g.red} ${g.result} ${g.black}</b><div class="muted">${g.year||''} ${g.event||''} ｜ 開局：${g.opening||'未分類'} ｜ ${g.exactMoves?.length||0} 手可播放</div><div>${(g.tokens||[]).slice(0,20).join(' ')}</div><a href="game.html?id=${g.id}">▶ 查看／原棋盤播放</a>　${g.detailUrl?`<a href="${g.detailUrl}" target="_blank">🌐 東萍公開頁</a>`:''}</div>`).join('')||'沒有資料'}
loadMasters();loadPlayers();loadGames();
</script></body></html>
