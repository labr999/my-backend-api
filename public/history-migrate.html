<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舊版記譜歷史救援</title><style>body{margin:0;background:#f7f2e8;color:#24180f;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:760px;margin:30px auto;padding:18px}.card{background:#fff;border:1px solid #e7dac8;border-radius:16px;padding:20px}.btn{padding:11px 14px;border:0;border-radius:10px;background:#8b1a1a;color:#fff;cursor:pointer;margin:6px 6px 6px 0}.alt{background:#eee6db;color:#5c4637}.status{white-space:pre-wrap;background:#faf7f1;padding:12px;border-radius:10px;margin-top:12px;font-size:.85rem}.warn{background:#fff4db;padding:12px;border-radius:10px;line-height:1.7;font-size:.84rem}</style></head><body><main><div class="card"><h1>🛟 舊版記譜歷史救援</h1><p>你的原始 <b>index.html</b> 使用 IndexedDB（資料庫名 <code>xiangqiDB</code>）與 localStorage 儲存歷史。新網站跑在 <code>http://localhost:3000</code>，瀏覽器不會自動把舊的 <code>file://</code> 歷史搬過來。</p><div class="warn">如果舊版歷史還在，請用你以前存放 <code>index.html</code> 的舊檔案位置開啟這個救援頁（網址列應顯示 <code>file:///...</code>），再按「讀取舊歷史」。如果瀏覽器資料已被清除，就無法從網站程式恢復。</div><button class="btn" onclick="readOld()">1. 讀取舊歷史</button><button class="btn" onclick="sendNew()">2. 同步到 V2 後端</button><button class="btn alt" onclick="downloadJson()">下載 JSON 備份</button><label class="btn alt" style="display:inline-block">選擇 JSON<input id="file" type="file" accept="application/json" style="display:none" onchange="loadJson(this.files[0])"></label><div id="status" class="status">尚未讀取。</div></div></main><script>
let games=[];const status=t=>document.getElementById('status').textContent=t;
function idbAll(){return new Promise(resolve=>{if(!indexedDB)return resolve([]);let r;try{r=indexedDB.open('xiangqiDB',1)}catch(e){return resolve([])}r.onsuccess=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('games'))return resolve([]);try{const tx=db.transaction('games','readonly');const q=tx.objectStore('games').getAll();q.onsuccess=()=>resolve(q.result||[]);q.onerror=()=>resolve([])}catch(e){resolve([])}};r.onerror=()=>resolve([]);r.onupgradeneeded=()=>{}})}
async function readOld(){status('正在讀取 file:// 舊版 IndexedDB…');const a=await idbAll();let b=[];try{const raw=localStorage.getItem('xiangqi_imported_games');if(raw)b=JSON.parse(raw)||[]}catch(e){}const map=new Map();[...a,...b].forEach(g=>{const k=(g.name||'')+'|'+(g.side||'')+'|'+(g.cat||'');map.set(k,g)});games=[...map.values()];status(`讀取完成。\nIndexedDB：${a.length} 盤\nlocalStorage：${b.length} 盤\n去除重複後：${games.length} 盤\n\n${games.slice(0,10).map(g=>'• '+(g.name||'未命名')).join('\n')}${games.length>10?'\n…':''}`)}
async function sendNew(){if(!games.length){await readOld();}if(!games.length)return status('沒有可同步的舊棋譜。請確認此頁是從舊版 file:// 位置開啟。');try{const r=await fetch('http://127.0.0.1:3000/api/import-history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({games})});const d=await r.json();status(`同步完成！\n新增：${d.added||0}\n更新：${d.updated||0}\n目前後端棋譜：${d.stats?.games||0}\n\n現在可回到 http://localhost:3000/repository.html 搜尋。`)}catch(e){status('同步失敗：\n'+e+'\n\n請先啟動 V2，再按一次同步。')}}
async function loadJson(file){if(!file)return;try{games=JSON.parse(await file.text())||[];status(`已讀取 JSON 備份：${games.length} 盤。\n現在可按「同步到 V2 後端」。`)}catch(e){status('JSON 讀取失敗：'+e)}}
function downloadJson(){if(!games.length)return status('先按「讀取舊歷史」。');const blob=new Blob([JSON.stringify(games,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='xiangqi-old-history-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script></body></html>
