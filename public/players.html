<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棋手庫</title><style>
body{margin:0;background:#f7f2e8;color:#24180f;font-family:system-ui,"Noto Sans TC",sans-serif}header{background:#8b1a1a;color:#fff;padding:18px}main{max-width:1050px;margin:auto;padding:16px}.bar{background:#fff;padding:14px;border-radius:14px;margin-bottom:14px;display:flex;gap:8px}.field,button{padding:11px;border:1px solid #ddcfbb;border-radius:9px;font:inherit}button{background:#8b1a1a;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:#fff;border:1px solid #e7dac8;border-radius:14px;padding:15px;cursor:pointer}.meta{color:#76675b;font-size:.84rem}.back{color:white;text-decoration:none;margin-right:16px}</style></head>
<body>
<div id="xq-version-badge" style="position:fixed;top:10px;right:10px;z-index:99999;background:#111;color:#fff;padding:6px 10px;border-radius:999px;font:600 12px/1.2 system-ui, sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2)">象棋小棋聖 <span style="opacity:.75">V2.8</span> <span id="xq-version-status">●</span></div>
<script>
(async()=>{try{const r=await fetch('/api/health',{cache:'no-store'});const d=await r.json();const el=document.getElementById('xq-version-status');if(el)el.textContent=d.ok?'● V'+d.version:'● OFFLINE';}catch(e){}})();
</script><header><a class="back" href="/">← 首頁</a><b>♟ 棋手名家</b></header><main><div class="bar"><input id="q" class="field" style="flex:1" placeholder="輸入棋手姓名，例如：王天一" oninput="load()"><button onclick="load()">搜尋</button></div><div id="list" class="grid"></div></main>
<script>
async function load(){const d=await fetch('/api/players?q='+encodeURIComponent(q.value)).then(r=>r.json());list.innerHTML=d.items.map(p=>`<div class="card" onclick="location.href='/player.html?name='+encodeURIComponent('${String(p.name).replace(/'/g,"\\'")}')"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.title||'')}　·　收錄 ${p.games||0} 盤　·　勝 ${p.wins||0}</div><div style="margin-top:8px;font-size:.78rem;color:#8b1a1a">查看：對手／開局／賽事／年份統計 →</div></div>`).join('')||'<div class="card">找不到棋手</div>'}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}load();
</script></main></body></html>
