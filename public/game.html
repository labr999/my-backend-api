<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原棋盤播放 - 東萍棋譜同步</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; color: #2c3e50; text-align: center; }
        
        .sync-box {
            background: #eef2f7;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        button {
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .status-msg {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 500;
        }
        .status-msg.info { color: #2563eb; }
        .status-msg.success { color: #16a34a; }
        .status-msg.error { color: #dc2626; }

        .game-info {
            background: #fafafa;
            border-left: 4px solid #2563eb;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 0 6px 6px 0;
        }
        .game-info h3 { margin: 0 0 6px 0; font-size: 16px; color: #1e293b; }
        .game-info p { margin: 4px 0; font-size: 14px; color: #64748b; }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .moves-display {
            width: 100%;
            height: 180px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            overflow-y: auto;
            background: #f8fafc;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>象棋原棋盤播放器</h2>

    <!-- 同步東萍網址區塊 -->
    <div class="sync-box">
        <label for="dpxq-url" style="font-weight: bold; color: #334155;">輸入東萍棋譜網址：</label>
        <div class="input-group">
            <input type="text" id="dpxq-url" placeholder="https://www.dpxq.com/h5dpxq/h5.asp?id=..." value="http://www.dpxq.com/h5/1.html">
            <button id="sync-btn" onclick="syncDpxqGame()">同步棋譜</button>
        </div>
        <div id="status-msg" class="status-msg"></div>
    </div>

    <!-- 棋局資訊區塊 -->
    <div class="game-info">
        <h3 id="game-title">對局名稱：尚未同步</h3>
        <p>紅方：<span id="red-player">-</span> | 黑方：<span id="black-player">-</span></p>
    </div>

    <!-- 棋譜與播放器區塊 -->
    <div class="board-container">
        <div style="width:100%; margin-bottom:8px; font-weight:bold; color:#475569;">解析著法數據 (Moves Data)：</div>
        <div id="moves-display" class="moves-display">請按下「同步棋譜」開始抓取東萍數據...</div>
    </div>
</div>

<script>
async function syncDpxqGame() {
    const urlInput = document.getElementById('dpxq-url');
    const syncBtn = document.getElementById('sync-btn');
    const statusMsg = document.getElementById('status-msg');
    
    const targetUrl = urlInput.value.trim();
    if (!targetUrl) {
        showStatus('請輸入東萍棋譜網址', 'error');
        return;
    }

    // UI Loading State
    syncBtn.disabled = true;
    syncBtn.textContent = '同步中...';
    showStatus('正在連線後端抓取東萍棋譜...', 'info');

    try {
        // Call Backend API to prevent CORS and handle GBK encoding
        const apiUrl = `/api/fetch-dpxq?url=${encodeURIComponent(targetUrl)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || '無法同步棋譜');
        }

        // Render Data on UI
        document.getElementById('game-title').textContent = `對局名稱：${data.title}`;
        document.getElementById('red-player').textContent = data.red || '未知';
        document.getElementById('black-player').textContent = data.black || '未知';
        document.getElementById('moves-display').textContent = `[動態著法碼]
${data.moves}

[初始陣型碼]
${data.initBoard || '預設排局'}`;

        showStatus(`同步成功！已成功載入《${data.title}》`, 'success');

        // 如果您有棋盤元件的播放函式，請在此處呼叫，例如：
        // playChessBoard(data.moves, data.initBoard);

    } catch (err) {
        console.error('同步出錯:', err);
        showStatus(`同步失敗：${err.message}`, 'error');
    } finally {
        syncBtn.disabled = false;
        syncBtn.textContent = '同步棋譜';
    }
}

function showStatus(text, type) {
    const statusMsg = document.getElementById('status-msg');
    statusMsg.textContent = text;
    statusMsg.className = `status-msg ${type}`;
}
</script>

</body>
</html>
