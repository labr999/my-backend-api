<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棋譜詳情</title><style>body{margin:0;background:#f7f2e8;color:#24180f;font-family:system-ui,"Noto Sans TC",sans-serif}header{background:#7f1717;color:#fff;padding:15px 18px}.back{color:#fff;text-decoration:none;margin-right:14px}main{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e7dac8;border-radius:16px;padding:16px;margin-bottom:12px}.meta{color:#76675b;font-size:.84rem;line-height:1.8}.moves{font-size:.95rem;line-height:2;background:#faf7f1;padding:12px;border-radius:12px;margin-top:12px}.move{display:inline-block;margin-right:8px}.actions a{display:inline-block;margin:8px 7px 0 0;padding:9px 11px;border-radius:9px;background:#8b1a1a;color:#fff;text-decoration:none;font-size:.82rem}.actions a.alt{background:#eee6db;color:#5c4637}</style></head><body><header><a class="back" href="/repository.html">← 棋譜倉庫</a><b>♟ 棋譜詳情</b></header><main id="app"><div class="card">載入中…</div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('/api/games/'+encodeURIComponent(id)).then(r=>r.json()).then(g=>{const rawMoves=(Array.isArray(g.tokens)&&g.tokens.length)?g.tokens:(g.moves||[]);const mv=rawMoves.map(m=>typeof m==='string'?m:(m&&m.notation?m.notation:'')).filter(Boolean);let vx=null;try{const r=JSON.parse(g.rawExport||'null');if(r&&r.videoId&&Array.isArray(r.moveTimes))vx=r}catch(e){}const vlink=i=>vx&&vx.moveTimes[i]!=null?'https://www.youtube.com/watch?v='+encodeURIComponent(vx.videoId)+'&t='+Math.max(0,Math.floor(vx.moveTimes[i])-2)+'s':'';app.innerHTML=`<section class="card"><h1>${esc(g.red)}　${esc(g.result||'未知')}　${esc(g.black)}</h1><div class="meta">${esc(g.event||'')}<br>年份：${g.year||'—'}　開局：${esc(g.opening||'未分類')}<br>來源：${esc(g.source||'')}<br>${esc(g.notes||'')}</div><div class="actions"><a href="/?gameId=${encodeURIComponent(g.id)}">原棋盤播放</a>${g.detailUrl?`<a href="${esc(g.detailUrl)}" target="_blank">${vx?'▶ 看影片':'查看公開棋譜來源'}</a>`:''}${g.sourceUrl?`<a class="alt" href="${esc(g.sourceUrl)}" target="_blank">東萍象棋網</a>`:''}</div></section><section class="card"><h2>棋譜</h2>${mv.length?`<div class="moves">${vx?'<div class="meta">▶ 點任一步，會在 YouTube 跳到影片中走這一步的地方</div>':''}${mv.map((m,i)=>`<span class="move"><b>${i%2===0?Math.floor(i/2)+1+'.':''}</b>${vlink(i)?`<a href="${vlink(i)}" target="_blank" style="color:#8b1a1a">${esc(m)}</a>`:esc(m)}</span>`).join('')}</div>`:'<p>此筆目前只有索引資料，尚未加入完整著法。</p>'}</section>`}).catch(e=>app.innerHTML='<div class="card">棋譜不存在</div>');</script></body></html>
