<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棋譜播放 V2.9.2</title><style>body{font-family:system-ui,"Microsoft JhengHei";background:#f5efe4;margin:0;color:#2c2119}header{background:#8d1515;color:#fff;padding:14px 22px}.wrap{max-width:1050px;margin:20px auto;padding:0 12px}.box{background:#fff;border-radius:14px;border:1px solid #decfbc;padding:15px;margin-bottom:14px}.board{width:min(82vw,720px);aspect-ratio:9/10;margin:auto;background:#e9c98f;position:relative;border:8px solid #7a4a23;box-sizing:border-box}.line{position:absolute;background:#51351f}.h{height:1px;left:5.5%;right:5.5%}.v{width:1px;top:5%;bottom:5%}.piece{position:absolute;width:8.5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:clamp(18px,3vw,32px);font-weight:700;background:#f5e7c8;border:2px solid #5a341e}.red{color:#b21e16}.black{color:#222}.controls button{padding:10px 16px;margin:4px;border:0;border-radius:8px;background:#8d1515;color:white}.moves{line-height:2}.muted{color:#756b61}</style></head><body><header>象棋小棋聖 V2.9.2　｜　原棋盤播放</header><div class="wrap"><div class="box"><h2 id="name"></h2><div id="info" class="muted"></div></div><div class="box"><div id="board" class="board"></div><div class="controls"><button onclick="first()">⏮ 第一手</button><button onclick="prev()">◀ 上一步</button><button onclick="next()">下一步 ▶</button><button onclick="last()">最後一手 ⏭</button><button onclick="auto()">▶ 自動播放</button></div><div id="mv" class="moves"></div></div></div><script>
let g={};let idx=0;const init=[['車','r',0,9],['馬','r',1,9],['相','r',2,9],['仕','r',3,9],['帥','r',4,9],['仕','r',5,9],['相','r',6,9],['馬','r',7,9],['車','r',8,9],['砲','r',1,7],['砲','r',7,7],['兵','r',0,6],['兵','r',2,6],['兵','r',4,6],['兵','r',6,6],['兵','r',8,6],['車','b',0,0],['馬','b',1,0],['象','b',2,0],['士','b',3,0],['將','b',4,0],['士','b',5,0],['象','b',6,0],['馬','b',7,0],['車','b',8,0],['砲','b',1,2],['砲','b',7,2],['卒','b',0,3],['卒','b',2,3],['卒','b',4,3],['卒','b',6,3],['卒','b',8,3]];let pieces=[];function xy(c,r){return [5.5+c*11.125,5+r*10]};function render(){board.innerHTML='';for(let i=0;i<10;i++){const h=document.createElement('div');h.className='line h';h.style.top=(5+i*10)+'%';board.appendChild(h)}for(let i=0;i<9;i++){const v=document.createElement('div');v.className='line v';v.style.left=(5.5+i*11.125)+'%';if(i>0&&i<8)v.style.top='5%';board.appendChild(v)}pieces.forEach(p=>{if(!p.alive)return;const e=document.createElement('div');e.className='piece '+(p.side==='r'?'red':'black');e.textContent=p.type;const [x,y]=xy(p.col,p.row);e.style.left=x+'%';e.style.top=y+'%';board.appendChild(e)});mv.textContent=(g.tokens||[]).map((x,i)=>`${i+1}. ${x}`).join('　')}
function reset(){pieces=init.map(x=>({type:x[0],side:x[1],col:x[2],row:x[3],alive:true}));idx=0;apply();render()}function apply(){pieces=init.map(x=>({type:x[0],side:x[1],col:x[2],row:x[3],alive:true}));for(let i=0;i<idx;i++){const m=g.exactMoves?.[i]||g.moves?.[i];if(!m)break;const p=pieces.find(p=>p.alive&&p.col===m.from[0]&&p.row===m.from[1]);if(!p)continue;const cap=pieces.find(x=>x.alive&&x.col===m.to[0]&&x.row===m.to[1]&&x!==p);if(cap)cap.alive=false;p.col=m.to[0];p.row=m.to[1]}}function first(){idx=0;apply();render()}function prev(){idx=Math.max(0,idx-1);apply();render()}function next(){idx=Math.min(g.exactMoves?.length||g.moves?.length||0,idx+1);apply();render()}function last(){idx=g.exactMoves?.length||g.moves?.length||0;apply();render()}function auto(){let t=setInterval(()=>{if(idx>=(g.exactMoves?.length||g.moves?.length||0)){clearInterval(t);return}next()},700)}async function boot(){g=await (await fetch('/api/games/'+new URLSearchParams(location.search).get('id'))).json();name.textContent=`${g.red}　${g.result}　${g.black}`;info.textContent=`${g.year||''} ${g.event||''}　開局：${g.opening||'未分類'}　格式：${g.format||''}　${g.exactMoves?.length||0} 手`;reset()}boot();
</script></body></html>
